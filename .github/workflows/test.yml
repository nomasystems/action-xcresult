name: 'build-test'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          npm install
      - run: |
          npm run all
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          xcresult-path: __tests__/data/build.xcresult
